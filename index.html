<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zafir: Out of the Oasis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #f2e2c4;
    --brown: #6b4423;
    --brown-dark: #4a2f18;
    --gold: #d4a934;
    --bright-gold: #FFD700;
    --terracotta: #c1502e;
    --night: #1c2b45;
    --good: #3f8f52;
    --bad: #a3392f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--night);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color: var(--sand);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--night);
    position: relative;
  }
  #topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--gold);
    text-transform: uppercase;
  }
  #progress-track {
    flex: 1;
    height: 4px;
    margin: 0 12px;
    background: rgba(212,169,52,0.2);
    border-radius: 2px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.35s ease;
  }
  #scene-wrap {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 110px;
    background: #0e1626;
    overflow: hidden;
  }
  #scene-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #scene-img.loaded { opacity: 1; }
  #story-strip {
    flex-shrink: 0;
    background: var(--brown-dark);
    border-top: 3px solid var(--gold);
    padding: 10px 16px;
    font-size: 19px;
    line-height: 1.45;
    min-height: 64px;
    max-height: 32vh;
    max-height: 32dvh;
    overflow: hidden;
  }
  .gap-token {
    display: inline;
    white-space: nowrap;
    color: var(--gold);
    font-weight: bold;
  }
  .gap-token.filled { color: var(--sand); border-bottom: 2px solid var(--gold); }
  .gap-token.active { color: #ffe9a8; }
  #options {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 10px 14px 4px;
    justify-content: space-between;
  }
  .opt-btn {
    flex: 1 1 0;
    min-width: 0;
    height: 54px;
    border: 2px solid #8a6a10;
    border-radius: 12px;
    background: linear-gradient(#ffe45c, #FFD700 55%, #d9a900);
    color: #2a1a0d;
    font-family: 'Bangers', 'Impact', sans-serif;
    font-size: 24px;
    letter-spacing: 0.04em;
    padding: 0;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
    transition: transform 0.08s ease, opacity 0.2s ease;
  }
  .opt-btn:active { transform: translateY(2px); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.dim { opacity: 0.4; }
  .opt-btn.tint-correct {
    background: linear-gradient(#b8f2b8, #90ee90 55%, #5cc45c);
    border-color: #2f7d32;
  }
  .opt-btn.tint-wrong {
    background: linear-gradient(#f2a59c, #d9534f 55%, #a3392f);
    border-color: #6e1f19;
    color: #fff;
  }
  #footer-msg {
    flex-shrink: 0;
    text-align: center;
    font-size: 13px;
    color: var(--gold);
    min-height: 52px;
    padding: 2px 18px calc(8px + env(safe-area-inset-bottom));
    line-height: 1.35;
  }
  #footer-msg .explain {
    display: block;
    color: #f2b3a3;
    margin-bottom: 2px;
  }
  #footer-msg .try-again {
    display: block;
    font-weight: bold;
    color: var(--gold);
  }
  #end-screen {
    display: none;
    flex: 1;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 40px 24px;
  }
  #end-screen h1 { color: var(--gold); font-size: 26px; margin-bottom: 12px; }
  #end-screen p { font-size: 16px; line-height: 1.6; }
  #restart-btn {
    margin-top: 22px;
    background: var(--terracotta);
    color: var(--sand);
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }

  /* Cover screen */
  #intro-screen {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 9vh 24px calc(9vh + env(safe-area-inset-bottom));
    background:
      linear-gradient(to bottom, rgba(26,0,48,0.82) 0%, rgba(26,0,48,0.35) 30%, rgba(26,0,48,0.1) 55%, rgba(26,0,48,0.85) 100%),
      url("scene-1-oasis-pool.png") center / cover no-repeat,
      #1a0030;
  }
  #intro-screen h1 {
    margin: 0;
    font-family: 'Bangers', 'Impact', sans-serif;
    font-weight: normal;
    font-size: 72px;
    line-height: 0.95;
    letter-spacing: 0.04em;
    color: var(--bright-gold);
    text-shadow: 0 4px 0 #4a2f18, 0 0 22px rgba(0,0,0,0.7);
  }
  #intro-screen h1 span {
    display: block;
    font-size: 40px;
    margin-top: 6px;
  }
  #intro-screen p {
    margin: 14px auto 0;
    max-width: 320px;
    font-family: 'Nunito', 'Georgia', sans-serif;
    font-weight: 800;
    font-size: 16px;
    line-height: 1.4;
    color: #f5e8c0;
    text-shadow: 0 2px 6px rgba(0,0,0,0.85);
  }
  #start-btn {
    border: 2px solid #8a6a10;
    background: linear-gradient(#ffe45c, #FFD700 55%, #d9a900);
    color: #3a1a5a;
    font-family: 'Bangers', 'Impact', sans-serif;
    font-size: 32px;
    letter-spacing: 0.06em;
    padding: 10px 52px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4);
  }
  #start-btn:active { transform: translateY(2px); }

  #main-game { display: none; flex-direction: column; flex: 1; min-height: 0; }
</style>
</head>
<body>
<div id="app">

  <div id="intro-screen">
    <div>
      <h1>Zafir<span>Out of the Oasis</span></h1>
      <p>Fill in each gap with the correct form of the verb shown.</p>
    </div>
    <button id="start-btn">Begin</button>
  </div>

  <div id="main-game">
    <div id="topbar">
      <span id="wave-text">Wave 1</span>
      <div id="progress-track"><div id="progress-fill"></div></div>
      <span id="count-text">1 / 100</span>
    </div>

    <div id="scene-wrap">
      <img id="scene-img" src="" alt="Scene">
    </div>

    <div id="story-strip">
      <span id="story-text"></span>
    </div>

    <div id="options"></div>
    <div id="footer-msg"></div>
  </div>

  <div id="end-screen">
    <h1>End of Chapter One</h1>
    <p>Zafir has reached the gates of Qalhara — but who is the figure in dark robes,<br>and why does he keep watching him instead of the festival?</p>
    <button id="restart-btn">Play Again</button>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   CONFIG
------------------------------------------------------------------ */
const DATA_URL = "game1-pages-data.json";
const IMG_ROOT = "";


/* ------------------------------------------------------------------
   SOUND — synthesized, no audio files needed
------------------------------------------------------------------ */
let audioCtx = null;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, start, dur, type, gain) {
  const c = ctx();
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime + start);
  g.gain.linearRampToValueAtTime(gain, c.currentTime + start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
  osc.connect(g).connect(c.destination);
  osc.start(c.currentTime + start);
  osc.stop(c.currentTime + start + dur + 0.02);
}
function playCorrect() {
  try {
    tone(880, 0, 0.14, "sine", 0.18);
    tone(1318.5, 0.09, 0.18, "sine", 0.16);
  } catch(e) {}
}
function playWrong() {
  try {
    tone(180, 0, 0.22, "sawtooth", 0.12);
  } catch(e) {}
}

/* ------------------------------------------------------------------
   SCENE MAP
------------------------------------------------------------------ */
const SCENE_MAP = [
  { from: 1,   file: "scene-1-oasis-pool.png" },
  { from: 7,   file: "scene-2-travelers-arrive.png" },
  { from: 21,  file: "scene-3-elders-permission.png" },
  { from: 26,  file: "scene-4-farewell-gathering.png" },
  { from: 34,  file: "scene-5-dawn-departure.png" },
  { from: 41,  file: "scene-6-night-desert-camp.png" },
  { from: 48,  file: "scene-7-storm-on-horizon.png" },
  { from: 58,  file: "scene-8-canyon-oasis.png" },
  { from: 61,  file: "scene-9-first-sight-of-qalhara.png" },
  { from: 73,  file: "scene-10-watching-stranger.png" },
  { from: 93,  file: "scene-11-fireworks-cliffhanger.png" }
];

function sceneForGap(id) {
  let file = SCENE_MAP[0].file;
  for (const entry of SCENE_MAP) {
    if (id >= entry.from) file = entry.file;
  }
  return IMG_ROOT + file;
}

/* ------------------------------------------------------------------
   STATE
------------------------------------------------------------------ */
let PAGES = [];
let currentPage = 0;
let currentGapPos = 0; // index into current page's gap_ids
let completedCount = 0;
let locked = false;
let currentSceneFile = "";

const el = {
  sceneImg: document.getElementById("scene-img"),
  waveText: document.getElementById("wave-text"),
  countText: document.getElementById("count-text"),
  progressFill: document.getElementById("progress-fill"),
  storyStrip: document.getElementById("story-strip"),
  storyText: document.getElementById("story-text"),
  options: document.getElementById("options"),
  footer: document.getElementById("footer-msg"),
  app: document.getElementById("app"),
  mainGame: document.getElementById("main-game"),
  introScreen: document.getElementById("intro-screen"),
  startBtn: document.getElementById("start-btn"),
  endScreen: document.getElementById("end-screen"),
  restartBtn: document.getElementById("restart-btn")
};

/* Shrink the story text until it fits its strip, so a page never needs scrolling */
function fitStory() {
  const s = el.storyStrip;
  let size = 19;
  s.style.fontSize = size + "px";
  while (size > 12 && s.scrollHeight > s.clientHeight + 1) {
    size--;
    s.style.fontSize = size + "px";
  }
}
window.addEventListener("resize", fitStory);

/* ------------------------------------------------------------------
   BOOT
------------------------------------------------------------------ */
fetch(DATA_URL)
  .then(r => {
    if (!r.ok) throw new Error("Could not load " + DATA_URL);
    return r.json();
  })
  .then(data => {
    PAGES = data;
  })
  .catch(err => {
    el.footer.textContent = "Could not load game data — check that " + DATA_URL + " is next to this file.";
    console.error(err);
  });

el.startBtn.addEventListener("click", () => {
  ctx(); // unlock audio on user gesture
  el.introScreen.style.display = "none";
  el.mainGame.style.display = "flex";
  renderPage(0);
});

/* ------------------------------------------------------------------
   RENDER ONE PAGE (one full sentence, one or more blanks)
------------------------------------------------------------------ */
function renderPage(index) {
  currentPage = index;
  currentGapPos = 0;
  locked = false;
  const page = PAGES[index];

  el.waveText.textContent = "Wave " + page.wave + " — " + page.wave_title;
  el.countText.textContent = completedCount + " / 100";
  el.progressFill.style.width = (completedCount / 100 * 100) + "%";

  const sceneFile = sceneForGap(page.gap_ids[0]);
  if (sceneFile !== currentSceneFile) {
    currentSceneFile = sceneFile;
    el.sceneImg.classList.remove("loaded");
    el.sceneImg.src = sceneFile;
    el.sceneImg.onload = () => el.sceneImg.classList.add("loaded");
  }

  // build the sentence with a blank token for every gap in this page
  let html = "";
  page.parts.forEach(part => {
    if (part.type === "text") {
      html += escapeHtml(part.value) + " ";
    } else {
      html += `<span class="gap-token" data-gap-id="${part.id}">....</span> `;
    }
  });
  el.storyText.innerHTML = html;
  fitStory();

  el.footer.textContent = "";
  renderOptionsForCurrentGap();
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function renderOptionsForCurrentGap() {
  const page = PAGES[currentPage];
  const gapId = page.gap_ids[currentGapPos];
  const gapData = page.gaps[gapId];

  // mark current blank as active
  page.gap_ids.forEach(gid => {
    const tok = el.storyText.querySelector(`[data-gap-id="${gid}"]`);
    if (tok) tok.classList.toggle("active", gid === gapId);
  });

  el.options.innerHTML = "";
  const shuffled = [...gapData.options].sort(() => Math.random() - 0.5);

  shuffled.forEach(optionText => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = optionText;
    btn.addEventListener("click", () => handleAnswer(btn, optionText, gapId, gapData));
    el.options.appendChild(btn);
  });
}

/* ------------------------------------------------------------------
   HANDLE TAP
------------------------------------------------------------------ */
function handleAnswer(btn, chosen, gapId, gapData) {
  if (locked || btn.disabled) return;

  const isCorrect = chosen === gapData.correct;

  if (isCorrect) {
    locked = true;
    btn.classList.add("tint-correct");
    playCorrect();

    const tok = el.storyText.querySelector(`[data-gap-id="${gapId}"]`);
    if (tok) {
      tok.textContent = gapData.correct;
      tok.classList.add("filled");
      tok.classList.remove("active");
    }
    fitStory();

    completedCount++;
    el.countText.textContent = completedCount + " / 100";
    el.progressFill.style.width = (completedCount / 100 * 100) + "%";

    [...el.options.children].forEach(b => {
      b.disabled = true;
      if (b !== btn) b.classList.add("dim");
    });

    const page = PAGES[currentPage];
    const moreInPage = currentGapPos + 1 < page.gap_ids.length;

    if (moreInPage) {
      el.footer.textContent = "Nice.";
      setTimeout(() => {
        currentGapPos++;
        locked = false;
        el.footer.textContent = "";
        renderOptionsForCurrentGap();
      }, 1100);
    } else {
      el.footer.textContent = "Nice.";
      setTimeout(() => {
        if (currentPage + 1 < PAGES.length) {
          renderPage(currentPage + 1);
        } else {
          showEnd();
        }
      }, 2400);
    }
  } else {
    btn.classList.add("tint-wrong");
    btn.disabled = true;
    btn.classList.add("dim");
    playWrong();
    const explanation = (gapData.explanations && gapData.explanations[chosen]) || "";
    el.footer.innerHTML = explanation
      ? `<span class="explain">${explanation}</span><span class="try-again">Try again.</span>`
      : "Try again.";
  }
}

function showEnd() {
  el.mainGame.style.display = "none";
  el.endScreen.style.display = "flex";
}

el.restartBtn.addEventListener("click", () => {
  el.endScreen.style.display = "none";
  el.mainGame.style.display = "flex";
  currentSceneFile = "";
  completedCount = 0;
  renderPage(0);
});
</script>
</body>
</html>
