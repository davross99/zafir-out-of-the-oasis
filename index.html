<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Zafir: Out of the Oasis</title> <style> :root { --sand: #f2e2c4; --brown: #6b4423; --brown-dark: #4a2f18; --gold: #d4a934; --terracotta: #c1502e; --night: #1c2b45; } * { box-sizing: border-box; } html, body { margin: 0; padding: 0; height: 100%; background: var(--night); font-family: 'Georgia', 'Iowan Old Style', serif; color: var(--sand); -webkit-tap-highlight-color: transparent; } #app { max-width: 520px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: var(--night); } #topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-size: 13px; letter-spacing: 0.04em; color: var(--gold); text-transform: uppercase; } #progress-track { flex: 1; height: 4px; margin: 0 12px; background: rgba(212,169,52,0.2); border-radius: 2px; overflow: hidden; } #progress-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.35s ease; } #scene-wrap { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #0e1626; overflow: hidden; flex-shrink: 0; } #scene-img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.4s ease; } #scene-img.loaded { opacity: 1; } #wave-label { position: absolute; top: 10px; left: 12px; background: rgba(28,43,69,0.75); border: 1px solid rgba(212,169,52,0.5); color: var(--gold); font-size: 12px; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.03em; } #story-strip { background: var(--brown-dark); border-top: 3px solid var(--gold); padding: 18px 20px 16px; font-size: 17px; line-height: 1.55; min-height: 92px; } #gap-blank { display: inline-block; min-width: 64px; border-bottom: 2px solid var(--gold); text-align: center; color: var(--gold); font-weight: bold; } #gap-blank.filled { color: var(--sand); } #options { display: flex; gap: 12px; padding: 16px 16px 22px; flex-wrap: wrap; justify-content: center; } .opt-btn { position: relative; width: 140px; height: 100px; border: none; background: transparent; padding: 0; cursor: pointer; } .opt-btn img { width: 100%; height: 100%; display: block; pointer-events: none; } .opt-btn span { position: absolute; top: 8%; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: bold; color: var(--brown-dark); text-shadow: 0 1px 0 rgba(255,255,255,0.35); pointer-events: none; } .opt-btn:disabled { cursor: default; } .opt-btn.dim { opacity: 0.45; } #footer-msg { text-align: center; font-size: 14px; color: var(--gold); min-height: 20px; padding-bottom: 10px; } #end-screen { display: none; flex: 1; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 40px 24px; } #end-screen h1 { color: var(--gold); font-size: 26px; margin-bottom: 12px; } #end-screen p { font-size: 16px; line-height: 1.5; } #restart-btn { margin-top: 22px; background: var(--terracotta); color: var(--sand); border: none; padding: 12px 28px; border-radius: 999px; font-size: 15px; font-family: inherit; cursor: pointer; } </style> </head> <body> <div id="app"> <div id="topbar"> <span id="wave-text">Wave 1</span> <div id="progress-track"><div id="progress-fill"></div></div> <span id="count-text">1 / 100</span> </div> <div id="scene-wrap"> <img id="scene-img" src="" alt="Scene"> </div> <div id="story-strip"> <span id="story-before"></span> <span id="gap-blank">?</span> <span id="story-after"></span> </div> <div id="options"></div> <div id="footer-msg"></div> <div id="end-screen"> <h1>End of Chapter One</h1> <p>Zafir has reached the gates of Qalhara — but who is the figure in dark robes,<br>and why does he keep watching him instead of the festival?</p> <button id="restart-btn">Play Again</button> </div> </div> <script> /* ------------------------------------------------------------------ CONFIG — paths are relative to wherever this file sits in the repo. If you move index.html, adjust these two roots. ------------------------------------------------------------------ */ const DATA_URL = "game1-gaps-data.json"; const IMG_ROOT = ""; const UI_ROOT = ""; const BUTTON = { default: UI_ROOT + "button-default.png", correct: UI_ROOT + "button-correct.png", wrong: UI_ROOT + "button-wrong.png" }; /* ------------------------------------------------------------------ SCENE MAP — which of the 11 story images shows for which gap range. This is my best read of where each image falls in the script; it's a coarse approximation for waves 4–5 since there are only 11 images for 100 gaps. Adjust the numbers on the left freely — everything else in the engine just reads from this table. ------------------------------------------------------------------ */ const SCENE_MAP = [ { from: 1, file: "scene-1-oasis-pool.png" }, { from: 7, file: "scene-2-travelers-arrive.png" }, { from: 21, file: "scene-3-elders-permission.png" }, { from: 26, file: "scene-4-farewell-gathering.png" }, { from: 34, file: "scene-5-dawn-departure.png" }, { from: 41, file: "scene-6-night-desert-camp.png" }, { from: 48, file: "scene-7-storm-on-horizon.png" }, { from: 58, file: "scene-8-canyon-oasis.png" }, { from: 61, file: "scene-9-first-sight-of-qalhara.png" }, { from: 73, file: "scene-10-watching-stranger.png" }, { from: 93, file: "scene-11-fireworks-cliffhanger.png" } ]; function sceneForGap(id) { let file = SCENE_MAP[0].file; for (const entry of SCENE_MAP) { if (id >= entry.from) file = entry.file; } return IMG_ROOT + file; } /* ------------------------------------------------------------------ STATE ------------------------------------------------------------------ */ let GAPS = []; let current = 0; let locked = false; let currentSceneFile = ""; const el = { sceneImg: document.getElementById("scene-img"), waveText: document.getElementById("wave-text"), countText: document.getElementById("count-text"), progressFill: document.getElementById("progress-fill"), before: document.getElementById("story-before"), after: document.getElementById("story-after"), blank: document.getElementById("gap-blank"), options: document.getElementById("options"), footer: document.getElementById("footer-msg"), app: document.getElementById("app"), endScreen: document.getElementById("end-screen"), restartBtn: document.getElementById("restart-btn") }; /* ------------------------------------------------------------------ BOOT ------------------------------------------------------------------ */ fetch(DATA_URL) .then(r => { if (!r.ok) throw new Error("Could not load " + DATA_URL); return r.json(); }) .then(data => { GAPS = data; renderGap(0); }) .catch(err => { el.footer.textContent = "Could not load game data — check that " + DATA_URL + " is next to this file."; console.error(err); }); /* ------------------------------------------------------------------ RENDER ONE GAP ------------------------------------------------------------------ */ function renderGap(index) { current = index; locked = false; const gap = GAPS[index]; // top bar el.waveText.textContent = "Wave " + gap.wave + " — " + gap.wave_title; el.countText.textContent = (index + 1) + " / " + GAPS.length; el.progressFill.style.width = ((index) / GAPS.length * 100) + "%"; // scene image (only swap if it actually changes, to avoid flicker) const sceneFile = sceneForGap(gap.id); if (sceneFile !== currentSceneFile) { currentSceneFile = sceneFile; el.sceneImg.classList.remove("loaded"); el.sceneImg.src = sceneFile; el.sceneImg.onload = () => el.sceneImg.classList.add("loaded"); } // story text el.before.textContent = gap.before + " "; el.after.textContent = " " + gap.after; el.blank.textContent = "?"; el.blank.classList.remove("filled"); // options — shuffle display order so correct isn't always in the same slot el.options.innerHTML = ""; el.footer.textContent = ""; const shuffled = [...gap.options].sort(() => Math.random() - 0.5); shuffled.forEach(optionText => { const btn = document.createElement("button"); btn.className = "opt-btn"; btn.innerHTML = `<img src="${BUTTON.default}" alt=""><span>${optionText}</span>`; btn.addEventListener("click", () => handleAnswer(btn, optionText, gap)); el.options.appendChild(btn); }); } /* ------------------------------------------------------------------ HANDLE TAP ------------------------------------------------------------------ */ function handleAnswer(btn, chosen, gap) { if (locked) return; locked = true; const isCorrect = chosen === gap.correct; const img = btn.querySelector("img"); img.src = isCorrect ? BUTTON.correct : BUTTON.wrong; el.blank.textContent = gap.correct; el.blank.classList.add("filled"); // dim + disable every button, reveal correct one if they got it wrong [...el.options.children].forEach(b => { b.disabled = true; if (b !== btn) b.classList.add("dim"); if (!isCorrect && b.querySelector("span").textContent === gap.correct) { b.querySelector("img").src = BUTTON.correct; b.classList.remove("dim"); } }); el.footer.textContent = isCorrect ? "Nice." : "Correct answer: " + gap.correct; setTimeout(() => { if (current + 1 < GAPS.length) { renderGap(current + 1); } else { showEnd(); } }, isCorrect ? 700 : 1400); } function showEnd() { el.progressFill.style.width = "100%"; el.app.querySelector("#scene-wrap").style.display = "none"; document.getElementById("story-strip").style.display = "none"; el.options.style.display = "none"; el.footer.style.display = "none"; el.endScreen.style.display = "flex"; } el.restartBtn.addEventListener("click", () => { el.endScreen.style.display = "none"; el.app.querySelector("#scene-wrap").style.display = "block"; document.getElementById("story-strip").style.display = "block"; el.options.style.display = "flex"; el.footer.style.display = "block"; currentSceneFile = ""; renderGap(0); }); </script> </body> </html>
